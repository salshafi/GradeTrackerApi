<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grade Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Grade Tracker</h1>
    <p>Front end (HTML/CSS/JS) &rarr; C# Web API &rarr; SQLite</p>
  </header>

  <main>
    <section id="add-grade-section">
      <h2>Add a Grade</h2>
      <form id="grade-form">
        <label for="courseName">Course</label>
        <input type="text" id="courseName" required>

        <label for="assignmentName">Assignment</label>
        <input type="text" id="assignmentName" required>

        <label for="score">Score</label>
        <input type="number" id="score" step="0.1" required>

        <label for="maxScore">Max Score</label>
        <input type="number" id="maxScore" step="0.1" required>

        <button type="submit">Add Grade</button>
      </form>
      <p id="form-message"></p>
    </section>

    <section id="grades-section">
      <h2>Recorded Grades</h2>
      <table id="grades-table">
        <thead>
          <tr>
            <th>Course</th>
            <th>Assignment</th>
            <th>Score</th>
            <th>Percentage</th>
            <th>Date Recorded</th>
          </tr>
        </thead>
        <tbody id="grades-body">
          <!-- Rows are inserted here by script.js -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
